<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <style>
    body { margin: 20px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; color: #222; }
    a { color: #0066cc; text-decoration: none; }
    article img { width: 360px; max-width: 100%; height: auto; display: block; margin: 12px auto; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    code, pre { background: #f7f7f7; padding: 2px 4px; border-radius: 4px; }
    pre { padding: 12px; overflow: auto; }
    h1,h2,h3 { line-height: 1.25; }
    .appeus-nav { font-size: 14px; color: #666; padding-bottom: 8px; border-bottom: 1px solid #eee; margin-bottom: 16px; }
    .appeus-nav .appeus-device { float: right; }
    .appeus-nav select { font: inherit; }
    .muted { color: #888; }
    table.states { border-collapse: collapse; width: 100%; }
    table.states th, table.states td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid #eee; }
    table.states img.thumb { width: 120px; height: auto; border: 1px solid #ddd; border-radius: 6px; }
    .appeus-toast { position: fixed; right: 16px; bottom: 16px; max-width: 60vw; padding: 10px 14px; border-radius: 8px; font-size: 14px; color: #fff; background: #333; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }
    .appeus-toast.ok { background: #2a7a2a; }
    .appeus-toast.err { background: #a83232; }
  </style>
</head>
<body>
  {{nav}}
  <article>
    {{content}}
  </article>
  {{extra}}
</body>
</html>
